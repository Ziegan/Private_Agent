[project]
name = "private-agent"
version = "0.1.0"
description = "Local-first private AI assistant with Ollama, local memory, RAG, and tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4==4.15.0",
    "httpx==0.28.1",
    "httpcore==1.0.9",
    "langchain-chroma==1.1.0",
    "langchain-core==1.6.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-ollama==1.1.0",
    "langchain-openai==1.1.14",
    "mcp>=1.24.0,<2.0.0",
    "ollama==0.6.2",
    "pydantic==2.13.5",
    "prompt-toolkit==3.0.53",
    "pypdf==6.19.0",
    "rank-bm25==0.2.2",
    "rich==15.0.0",
    "tiktoken==0.14.0",
]

[project.scripts]
private-agent = "private_agent.cli:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.10",
    "tomli>=2.0.1; python_version < '3.11'",
]
media = [
    "opencv-python-headless>=4.10,<5",
    "Pillow>=10,<13",
    "sounddevice>=0.5,<1",
    "faster-whisper>=1.1,<2",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["src"]
include = ["private_agent", "private_agent.*"]
namespaces = false

[tool.setuptools.package-data]
private_agent = ["resources/*.md"]
