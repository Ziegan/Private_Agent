name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux isolation tools
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap util-linux
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Verify generated runtime requirements
        run: python scripts/sync_requirements.py --check
      - name: Run Ruff correctness checks
        run: ruff check --select E4,E7,E9,F401 src main.py tests scripts
      - name: Verify console entrypoint
        run: private-agent --help
      - name: Verify checkout launcher
        run: python main.py --help
      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build
      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          forbidden_parts = {
              ".env", ".local_ai_chroma_db", ".local_ai_memory.db",
              "__pycache__", ".pytest_cache", ".ruff_cache",
          }

          def assert_clean(paths, *, allow_tests):
              for raw_path in paths:
                  path = Path(raw_path)
                  lowered_parts = {part.lower() for part in path.parts}
                  assert not lowered_parts.intersection(forbidden_parts), raw_path
                  assert not any(part.endswith((".sqlite", ".sqlite3", ".db", ".log")) for part in lowered_parts), raw_path
                  assert not any(part.endswith((".pem", ".key", ".p12", ".pfx")) for part in lowered_parts), raw_path
                  assert not any(part.startswith(".env") for part in lowered_parts), raw_path
                  if not allow_tests:
                      assert "tests" not in lowered_parts, raw_path

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_files = archive.namelist()
          assert_clean(wheel_files, allow_tests=False)
          assert "private_agent/cli.py" in wheel_files
          assert "private_agent/agent/runtime.py" in wheel_files
          assert "private_agent/tools/network.py" in wheel_files

          source = next(Path("dist").glob("*.tar.gz"))
          with tarfile.open(source, "r:gz") as archive:
              source_files = archive.getnames()
          assert_clean(source_files, allow_tests=True)
          assert any(path.endswith("/src/private_agent/cli.py") for path in source_files)
          PY
      - name: Install wheel in isolated smoke environment
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/private-agent-smoke"
          "$RUNNER_TEMP/private-agent-smoke/bin/python" -m pip install --no-deps dist/*.whl
      - name: Install sdist in isolated smoke environment
        run: |
          python -m venv --system-site-packages "$RUNNER_TEMP/private-agent-sdist-smoke"
          "$RUNNER_TEMP/private-agent-sdist-smoke/bin/python" -m pip install --no-deps dist/*.tar.gz
      - name: Verify installed entry points outside checkout
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/private-agent-smoke/bin/python" -c "import pathlib, private_agent; assert pathlib.Path(private_agent.__file__).is_relative_to(pathlib.Path(__import__('sys').prefix))"
          "$RUNNER_TEMP/private-agent-smoke/bin/private-agent" --help
          "$RUNNER_TEMP/private-agent-smoke/bin/python" -m private_agent --help
          "$RUNNER_TEMP/private-agent-sdist-smoke/bin/python" -c "import pathlib, private_agent; assert pathlib.Path(private_agent.__file__).is_relative_to(pathlib.Path(__import__('sys').prefix))"
          "$RUNNER_TEMP/private-agent-sdist-smoke/bin/private-agent" --help
          "$RUNNER_TEMP/private-agent-sdist-smoke/bin/python" -m private_agent --help
