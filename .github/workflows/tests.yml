name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Linux isolation tools
        run: sudo apt-get update && sudo apt-get install --yes bubblewrap util-linux
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest -q
      - name: Run Ruff correctness checks
        run: ruff check --select E4,E7,E9,F401 src tests
      - name: Verify console entrypoint
        run: private-agent --help
